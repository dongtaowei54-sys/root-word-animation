<script>
/* ================= 基础 ================= */
const clamp01 = p => p < 0 ? 0 : p > 1 ? 1 : p;
const seg  = (t, a, d, e) => { const p = clamp01((t - a) / d); return e ? e(p) : p; };
const lerp = (a, b, p) => a + (b - a) * p;
const quad = (a, b, c, p) => (1 - p) * (1 - p) * a + 2 * (1 - p) * p * b + p * p * c;

const eOut   = p => 1 - Math.pow(1 - p, 3);
const eIn    = p => p * p;
const eIn3   = p => p * p * p;
const eInOut = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const eBack  = p => 1 + 2.4 * Math.pow(p - 1, 3) + 1.4 * Math.pow(p - 1, 2);

function flight(t, t0, d, from, to, arc = 0, ease = eInOut) {
  const p = ease(seg(t, t0, d));
  return {
    x:  lerp(from.x,  to.x,  p),
    y:  lerp(from.y,  to.y,  p) - arc * Math.sin(p * Math.PI),
    rx: lerp(from.rx, to.rx, p),
    ry: lerp(from.ry, to.ry, p)
  };
}
const P = (x, y, r = 13) => ({ x, y, rx: r, ry: r });

/* 冲击波纹：形变衰减的扩散环 */
function pulse(t, t0, dur, x, y, r0, r1, op) {
  const p = seg(t, t0, dur);
  if (p <= 0 || p >= 1) return null;
  return { x, y, r: lerp(r0, r1, eOut(p)), op: op * (1 - p) };
}

/* ================= 形态数据 ================= */
const DUR   = 5.2;

        const st = Math.sin(Math.min(1, d * 1.3) * Math.PI);
        return {
          x: 300, y: lerp(196, 238, d),
          rx: 13 * (1 - 0.16 * st), ry: 13 * (1 + 0.26 * st),
          rot: 0, shape: st > 0.2 ? 'drop' : 'round', face: 'focus'
        };
      }
      /* 绷断：一块从顶部被撕走，剩下的球横向裂开、随即合上，整体小一圈 */
      const b = eOut(seg(t, 1.55, 0.40));
      const shrink = lerp(1, 0.78, b);
      return {
        x: lerp(300, 238, b),
        y: lerp(238, 226, b),
        rx: 13 * shrink * (1 + 0.10 * Math.sin(b * Math.PI)),
        ry: 13 * shrink,
        rot: 90, shape: 'round', face: 'wow', split: 0.5 * (1 - b)
      };
    },

    fx(t) {
      if (t > 0.95 && t < 1.55) {
        const d = eOut(seg(t, 0.95, 0.60));
        fxInk.setAttribute('x1', 300); fxInk.setAttribute('y1', 196);
        fxInk.setAttribute('x2', 300); fxInk.setAttribute('y2', lerp(196, 238, d) - 12);
        fxInk.setAttribute('opacity', 0.4 * Math.sin(d * Math.PI));
      }
      const br = seg(t, 1.55, 0.34);
      if (br > 0 && br < 1) {
        const s = eOut(br), X = 238, Y = 216;
        fxDust.setAttribute('d',
          `M${X - 12 - 2 * s},${Y - 4 - 8 * s}L${X - 18 - 6 * s},${Y - 10 - 10 * s}` +
          `M${X + 12 + 2 * s},${Y - 2 - 6 * s}L${X + 18 + 6 * s},${Y - 8 - 9 * s}`);
        fxDust.setAttribute('opacity', (1 - br) * 0.40);
      }
      const r = pulse(t, 1.55, 0.36, 238, 216, 8, 34, 0.24);
      if (r) {
        fxRing2.setAttribute('cx', r.x); fxRing2.setAttribute('cy', r.y);
        fxRing2.setAttribute('r', Math.max(1, r.r));
        fxRing2.setAttribute('opacity', r.op);
      }
    }
  },
];

const lineEl  = document.getElementById('mLine');
const wordEl  = document.getElementById('word');

const rootEl  = document.getElementById('rootEl');
const zhEl    = document.getElementById('zh');
const glossEl = document.getElementById('gloss');
const dotsEl  = document.getElementById('dots');

const fxRing  = document.getElementById('fxRing');
const fxRing2 = document.getElementById('fxRing2');
const fxDust  = document.getElementById('fxDust');
const fxInk   = document.getElementById('fxInk');
const fxShadow= document.getElementById('fxShadow');
const fxTrailA= document.getElementById('fxTrailA');
const fxTrailB= document.getElementById('fxTrailB');
const fxSpeed = document.getElementById('fxSpeed');

/* ================= 时间轴 =================
 * 每场 = 动画 5.2s + 配音冻结段 voDur。
 * 冻结发生在 ANCHOR（4.42）—— 此时动作已演完、词和释义都完整可见。
 * 动画时间 t_anim 与场景内时间 tl 的关系：
 *   tl ≤ ANCHOR            → t_anim = tl
 *   ANCHOR < tl ≤ A+vo     → t_anim = ANCHOR      （冻住）
 *   tl > A+vo              → t_anim = tl - vo     （继续，从 ANCHOR 往后接）
 */
const ANCHOR = 4.42;
const VO_DUR = [0.70, 0.85, 0.85, 0.95, 0.95, 0.85, 0.95];
const STARTS = [];
let TOTAL = 0;
(function () {
  let acc = 0;
  for (let i = 0; i < SCENES.length; i++) { STARTS.push(acc); acc += DUR + VO_DUR[i]; }
  TOTAL = acc;
})();

function localize(time) {
  const tt = ((time % TOTAL) + TOTAL) % TOTAL;
  let i = SCENES.length - 1;
  for (let k = 0; k < SCENES.length; k++) {
    if (tt < STARTS[k] + DUR + VO_DUR[k]) { i = k; break; }
  }
  return { i: i, tl: tt - STARTS[i], abs: tt };
}
function toAnim(tl, vo) {
  if (tl <= ANCHOR) return tl;
  if (tl <= ANCHOR + vo) return ANCHOR;
  return tl - vo;
}

let idx = -1;
let shift = 0;
let T = 0;
let paused = false;
let last = performance.now();

function setScene(i) {
  idx = i;
  const s = SCENES[i];
  /* 每场可换词根拼写（同一词族常有 ced / ceed / cess 几种写法） */
  if (s.root) rootEl.textContent = s.root;
  prefixEl.textContent = s.prefix;
  zhEl.textContent = s.zh;
  glossEl.innerHTML = s.parts
    .map(([en, cn]) => `<span class="g"><b>${en}</b>${cn}</span>`)
    .join('<i>+</i>');
  shift = prefixEl.offsetWidth / 2;
  [...dotsEl.children].forEach((d, k) => d.classList.toggle('on', k === i));
}


/* ================= 球体渲染层 =================
 * 球不再是一个 ellipse，而是按参数采样 56 点、Catmull-Rom 转贝塞尔生成的闭合 path。
 * 四种形状：
 *   round  圆
 *   taper  尾部（-X）收尖 —— 被拖着走时留下的尾迹
 *   drop   前端（+X）收尖 —— 被吸/被抽出去的水滴
 *   pinch  腰部被捏细 —— 卡在窄口里被挤
 * 脸不跟随 rot 旋转，但仍按 rx/ry 缩放，保证球被拉长时五官不会被挤出体外。
 */
const RD = Math.PI / 180;
const FACE_INK = '#0f2b52';
const gDot2  = document.getElementById('mDot2G');
const b2El   = document.getElementById('dot2Body');
const bA     = document.getElementById('dotBodyA');
const bB     = document.getElementById('dotBodyB');
const haloEl = document.getElementById('dotHalo');
const armEl  = document.getElementById('dotArm');
const handEl = document.getElementById('dotHand');
const eyeL   = document.getElementById('fEyeL'), eyeR = document.getElementById('fEyeR');
const pupL   = document.getElementById('fPupL'), pupR = document.getElementById('fPupR');
const mouthEl= document.getElementById('fMouth');

const fx1 = v => (Math.round(v * 10) / 10).toString();

/* 闭合平滑曲线 */
function smoothClosed(p) {
  const n = p.length;
  let d = 'M' + fx1(p[0][0]) + ',' + fx1(p[0][1]);
  for (let i = 0; i < n; i++) {
    const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
    d += 'C' + fx1(p1[0] + (p2[0] - p0[0]) / 6) + ',' + fx1(p1[1] + (p2[1] - p0[1]) / 6) +
         ' ' + fx1(p2[0] - (p3[0] - p1[0]) / 6) + ',' + fx1(p2[1] - (p3[1] - p1[1]) / 6) +
         ' ' + fx1(p2[0]) + ',' + fx1(p2[1]);
  }
  return d + 'Z';
}

/* 半圆弧（末尾用直线封口成直径） */
function halfD(x, y, rx, ry, rot, side, gap) {
  const N = 24, pts = [];
  const c = Math.cos(rot * RD), s = Math.sin(rot * RD);
  const a0 = side > 0 ? -Math.PI / 2 : Math.PI / 2;
  for (let i = 0; i <= N; i++) {
    const a = a0 + Math.PI * i / N;
    const px = Math.cos(a) * rx + side * gap;
    const py = Math.sin(a) * ry;
    pts.push([x + px * c - py * s, y + px * s + py * c]);
  }
  let d = 'M' + fx1(pts[0][0]) + ',' + fx1(pts[0][1]);
  for (let i = 0; i < N; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(N, i + 2)];
    d += 'C' + fx1(p1[0] + (p2[0] - p0[0]) / 6) + ',' + fx1(p1[1] + (p2[1] - p0[1]) / 6) +
         ' ' + fx1(p2[0] - (p3[0] - p1[0]) / 6) + ',' + fx1(p2[1] - (p3[1] - p1[1]) / 6) +
         ' ' + fx1(p2[0]) + ',' + fx1(p2[1]);
  }
  return d + 'Z';
}

function bodyD(x, y, rx, ry, rot, shape) {
  const N = 56, pts = [];
  const c = Math.cos(rot * RD), s = Math.sin(rot * RD);
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2;
    let ux = Math.cos(a), uy = Math.sin(a);
    if (shape === 'taper') {            /* 尾端（-X）收成尖 */
      ux *= 1.16;
      uy *= 1 - 0.55 * Math.max(0, -Math.cos(a));
    } else if (shape === 'drop') {      /* 尖端（+X）收成尖 */
      ux *= 1.16;
      uy *= 1 - 0.55 * Math.max(0, Math.cos(a));
    } else if (shape === 'flat') {        /* 被压成一滩：横向摊开、竖向几乎贴地 */
      ux *= 1.5;
      uy *= 0.22;
    } else if (shape === 'pinch') {     /* 腰被捏细 */
      const k = Math.pow(Math.abs(Math.sin(a)), 1.1);
      ux *= 1 + 0.12 * k;
      uy *= 1 - 0.34 * k;
    }
    const px = ux * rx, py = uy * ry;
    pts.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return smoothClosed(pts);
}

/* 手臂：优先用「抓握目标点」(tx,ty)，从球面朝目标伸出，末端画手指环。
   目标点几乎贴着球时自动隐藏，避免出现悬空的小钩子。 */
function drawArm(d) {
  const a = d.arm;
  const off = () => { armEl.setAttribute('opacity', 0); handEl.setAttribute('opacity', 0); };
  if (!a) { off(); return; }
  let tx, ty, grip = 1;
  if (a.tx !== undefined) {
    tx = a.tx; ty = a.ty;
    if (a.grip !== undefined) grip = a.grip;
  } else {
    if (a.len < 0.6) { off(); return; }
    const ang = (a.ang || 0) * RD;
    tx = d.x + Math.cos(ang) * (d.rx * 0.9 + a.len);
    ty = d.y + Math.sin(ang) * (d.ry * 0.9 + a.len);
    grip = a.len / 11;
  }
  /* 起点：球面朝目标方向的那一点（椭圆求交） */
  const vx = tx - d.x, vy = ty - d.y;
  const vl = Math.hypot(vx, vy);
  if (vl < d.rx * 0.75) { off(); return; }
  const ux = vx / vl, uy = vy / vl;
  const k = 1 / Math.hypot(ux / d.rx, uy / d.ry);
  const ex = d.x + ux * k * 0.92, ey = d.y + uy * k * 0.92;
  const nx = -uy, ny = ux;
  const bow = 2.6 * clamp01(grip);
  const mx = (ex + tx) / 2 + nx * bow;
  const my = (ey + ty) / 2 + ny * bow;
  armEl.setAttribute('d', 'M' + fx1(ex) + ',' + fx1(ey) + 'Q' + fx1(mx) + ',' + fx1(my) + ' ' + fx1(tx) + ',' + fx1(ty));
  armEl.setAttribute('opacity', clamp01(grip));
  handEl.setAttribute('cx', fx1(tx));
  handEl.setAttribute('cy', fx1(ty));
  handEl.setAttribute('r', fx1(3.4 * clamp01(grip) + 0.6));
  handEl.setAttribute('opacity', clamp01(grip));
}

function drawFace(d) {
  const f = d.face || 'focus';
  /* 五官按"较短半径"等比缩放：球被压扁/拉长时不会撑破轮廓 */
  const rr = Math.min(d.rx, d.ry);
  const er = rr * 0.30;
  const hide = () => {
    [eyeL, eyeR, pupL, pupR, mouthEl].forEach(e => e.setAttribute('opacity', 0));
  };
  if (er < 1.8) { hide(); return; }

  const dx = Math.min(rr * 0.58, 6.2);
  const cy = d.y - rr * 0.10;
  const cx = d.x;
  const hasWhite = (f === 'happy' || f === 'wow' || f === 'shock');
  const ew = er * (f === 'shock' ? 1.24 : 1);
  const eh = er * (f === 'shock' ? 1.30 : 1.04);

  [[eyeL, cx - dx], [eyeR, cx + dx]].forEach(([el, X]) => {
    el.setAttribute('cx', fx1(X)); el.setAttribute('cy', fx1(cy));
    el.setAttribute('rx', fx1(ew)); el.setAttribute('ry', fx1(eh));
    el.setAttribute('opacity', hasWhite ? 1 : 0);
  });

  const pr = er * (f === 'shock' ? 0.32 : f === 'wow' ? 0.42 : 0.54);
  const lineMode = (f === 'dizzy' || f === 'focus');
  const pupD = (X, Y) => {
    if (f === 'dizzy') {
      const q = er * 1.05;
      return 'M' + fx1(X - q) + ',' + fx1(Y - q) + 'L' + fx1(X + q) + ',' + fx1(Y + q) +
             'M' + fx1(X + q) + ',' + fx1(Y - q) + 'L' + fx1(X - q) + ',' + fx1(Y + q);
    }
    if (f === 'focus') {
      const q = er * 1.08;
      return 'M' + fx1(X - q) + ',' + fx1(Y - er * 0.08) + 'Q' + fx1(X) + ',' + fx1(Y + er * 0.62) + ' ' + fx1(X + q) + ',' + fx1(Y - er * 0.08);
    }
    if (f === 'love') {
      const s2 = er * 1.05;
      return 'M' + fx1(X) + ',' + fx1(Y + s2 * 0.42) +
             'C' + fx1(X - s2 * 0.95) + ',' + fx1(Y - s2 * 0.30) + ' ' + fx1(X - s2 * 0.45) + ',' + fx1(Y - s2 * 1.05) + ' ' + fx1(X) + ',' + fx1(Y - s2 * 0.42) +
             'C' + fx1(X + s2 * 0.45) + ',' + fx1(Y - s2 * 1.05) + ' ' + fx1(X + s2 * 0.95) + ',' + fx1(Y - s2 * 0.30) + ' ' + fx1(X) + ',' + fx1(Y + s2 * 0.42) + 'Z';
    }
    return 'M' + fx1(X - pr) + ',' + fx1(Y) + 'a' + fx1(pr) + ',' + fx1(pr) + ' 0 1,0 ' + fx1(pr * 2) + ',0a' + fx1(pr) + ',' + fx1(pr) + ' 0 1,0 ' + fx1(-pr * 2) + ',0Z';
  };

  /* look: -1 看左 / +1 看右，只有眼球转，眼白不动 */
  const lx = clamp01(Math.abs(d.look || 0)) * Math.sign(d.look || 0) * er * 0.62;
  [[pupL, cx - dx + lx], [pupR, cx + dx + lx]].forEach(([el, X]) => {
    el.setAttribute('d', pupD(X, cy));
    el.setAttribute('fill', lineMode ? 'none' : FACE_INK);
    el.setAttribute('stroke', lineMode ? FACE_INK : 'none');
    el.setAttribute('stroke-width', lineMode ? fx1(Math.max(1.3, er * 0.36)) : 0);
    el.setAttribute('opacity', 1);
  });

  const mw = Math.min(rr * 0.46, 5.2);
  const my = cy + rr * 0.44;
  let md, mFill = 'none';
  if (f === 'happy')      md = 'M' + fx1(cx - mw) + ',' + fx1(my) + 'Q' + fx1(cx) + ',' + fx1(my + mw * 0.95) + ' ' + fx1(cx + mw) + ',' + fx1(my);
  else if (f === 'love')  md = 'M' + fx1(cx - mw * 0.7) + ',' + fx1(my) + 'Q' + fx1(cx) + ',' + fx1(my + mw * 0.8) + ' ' + fx1(cx + mw * 0.7) + ',' + fx1(my);
  else if (f === 'focus') md = 'M' + fx1(cx - mw * 0.55) + ',' + fx1(my) + 'L' + fx1(cx + mw * 0.55) + ',' + fx1(my);
  else if (f === 'dizzy') md = 'M' + fx1(cx - mw) + ',' + fx1(my) + 'q' + fx1(mw * 0.5) + ',' + fx1(-mw * 0.65) + ' ' + fx1(mw) + ',0t' + fx1(mw) + ',0';
  else {
    mFill = FACE_INK;
    const rx2 = f === 'shock' ? mw * 0.58 : mw * 0.44;
    const ry2 = f === 'shock' ? mw * 0.76 : mw * 0.52;
    md = 'M' + fx1(cx - rx2) + ',' + fx1(my) + 'a' + fx1(rx2) + ',' + fx1(ry2) + ' 0 1,0 ' + fx1(rx2 * 2) + ',0a' + fx1(rx2) + ',' + fx1(ry2) + ' 0 1,0 ' + fx1(-rx2 * 2) + ',0Z';
  }
  mouthEl.setAttribute('d', md);
  mouthEl.setAttribute('fill', mFill);
  mouthEl.setAttribute('stroke', mFill === 'none' ? FACE_INK : 'none');
  mouthEl.setAttribute('opacity', 1);
}

function drawBall(d) {
  const split = d.split || 0;
  /* 受惊变色：全片唯一一次偏离品牌蓝，用来强调"注意力被勾走" */
  const fill = d.tint ? mixColor(BLUE, ALERT, clamp01(d.tint)) : BLUE;
  if (bA.getAttribute('fill') !== fill) bA.setAttribute('fill', fill);
  if (bB.getAttribute('fill') !== fill) bB.setAttribute('fill', fill);
  /* 自定义形状旁路：dot() 返回 d（闭合 path 字符串）时直接用它画身体。
     车、动物轮廓等由场景自己算，rx/ry 仍作表情的尺度基准。 */
  if (d.d) {
    bA.setAttribute('d', d.d);
    bB.setAttribute('opacity', 0);
    /* 可选白底：深色身体上五官看不清时，给一块白色垫底（如车窗兼脸区） */
    if (d.halo) {
      haloEl.setAttribute('d', d.halo);
      haloEl.setAttribute('opacity', 1);
    } else haloEl.setAttribute('opacity', 0);
    drawArm(d);
    drawFace(d);
    return;
  }
  haloEl.setAttribute('opacity', 0);
  if (split > 0.02) {
    const gap = split * 8;
    bA.setAttribute('d', halfD(d.x, d.y, d.rx, d.ry, d.rot || 0, -1, gap));
    bB.setAttribute('d', halfD(d.x, d.y, d.rx, d.ry, d.rot || 0, 1, gap));
    bB.setAttribute('opacity', 1);
  } else {
    bA.setAttribute('d', bodyD(d.x, d.y, d.rx, d.ry, d.rot || 0, d.shape || 'round'));
    bB.setAttribute('opacity', 0);
  }
  drawArm(d);
  drawFace(d);
}

const subEyeL = document.getElementById('subEyeL'), subEyeR = document.getElementById('subEyeR');
const subPupL = document.getElementById('subPupL'), subPupR = document.getElementById('subPupR');

/* 副球：常驻配角。支持 {x,y,r|rx,ry,rot,shape,face,look,op,fill} */
function drawSub(s) {
  const hide = () => {
    gDot2.setAttribute('opacity', 0);
    [subEyeL, subEyeR, subPupL, subPupR].forEach(e => e.setAttribute('opacity', 0));
  };
  if (!s) { hide(); return; }
  const op = s.op === undefined ? 1 : s.op;
  const rx = s.rx !== undefined ? s.rx : (s.r || 13);
  const ry = s.ry !== undefined ? s.ry : rx;
  if (op <= 0.02 || rx < 0.6) { hide(); return; }

  gDot2.setAttribute('opacity', op.toFixed(2));
  b2El.setAttribute('d', bodyD(s.x, s.y, rx, ry, s.rot || 0, s.shape || 'round'));
  b2El.setAttribute('fill', s.fill || '#8b9199');

  const rr = Math.min(rx, ry);
  const f = s.face || 'calm';
  if (f === 'none' || rr < 6) {
    [subEyeL, subEyeR, subPupL, subPupR].forEach(e => e.setAttribute('opacity', 0));
    return;
  }
  const er = rr * (f === 'shock' ? 0.40 : 0.30);
  const dx = Math.min(rr * 0.46, 5.2);
  const cy = s.y - rr * 0.06;
  const lx = clamp01(Math.abs(s.look || 0)) * Math.sign(s.look || 0) * er * 0.55;

  [[subEyeL, s.x - dx], [subEyeR, s.x + dx]].forEach(([el, X]) => {
    el.setAttribute('cx', fx1(X)); el.setAttribute('cy', fx1(cy));
    el.setAttribute('rx', fx1(er)); el.setAttribute('ry', fx1(er * (f === 'shock' ? 1.15 : 1)));
    el.setAttribute('opacity', 1);
  });
  const pr = er * (f === 'shock' ? 0.30 : 0.46);
  [[subPupL, s.x - dx + lx], [subPupR, s.x + dx + lx]].forEach(([el, X]) => {
    el.setAttribute('cx', fx1(X)); el.setAttribute('cy', fx1(cy));
    el.setAttribute('r', fx1(pr));
    el.setAttribute('opacity', 1);
  });
}

/* ================= 镜头层 =================
 * 只对图形层 .art 施加 translate+scale，文字层完全不动 ——
 * 这样推近时球变大更有冲击力，单词和释义永远稳稳待在中下部，不会被裁切。
 * 每场结尾（OUTRO 前）镜头自动回到标准机位，场景切换不会有跳变。
 */
const BLUE  = '#1a6ff0';
const ALERT = '#ef5b3d';
const CAM0  = { k: 1, fx: 187.5, fy: 170 };
const artEl = document.getElementById('svg');

function mixColor(a, b, p) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const r = Math.round(lerp((A >> 16) & 255, (B >> 16) & 255, p));
  const g = Math.round(lerp((A >> 8) & 255, (B >> 8) & 255, p));
  const c = Math.round(lerp(A & 255, B & 255, p));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + c).toString(16).slice(1);
}

function applyCam(c, back) {
  const k  = lerp(1, c.k, back);
  const fx = lerp(CAM0.fx, c.fx, back);
  const fy = lerp(CAM0.fy, c.fy, back);
  const sx = (c.sx || 0) * back, sy = (c.sy || 0) * back;
  artEl.style.transform =
    'translate(' + (fx * (1 - k) + sx).toFixed(2) + 'px,' + (fy * (1 - k) + sy).toFixed(2) +
    'px) scale(' + k.toFixed(4) + ')';
}

/* ================= 道具层 ================= */
const pBookG  = document.getElementById('pBook');
const pageL   = document.getElementById('bookPageL');
const pageR   = document.getElementById('bookPageR');
const spineEl = document.getElementById('bookSpine');
const pClawG  = document.getElementById('pClaw');
const clawArm = document.getElementById('clawArm');
const clawHook= document.getElementById('clawHook');
const pField  = document.getElementById('pField');
const pPuffG  = document.getElementById('pPuff');
const puffs   = [0, 1, 2].map(n => document.getElementById('puff' + n));
const pFold   = document.getElementById('pFold');
const pGhost  = document.getElementById('pGhost');
const pHole   = document.getElementById('pHole');

/* 书：中心 bx、底边贴 y=196 的那条线。
 * 两页从书脊向两侧展开、外侧最高（像真的翻开一本书），外侧还带一点翻卷。 */
const BOOK = { bx: 138, b: 196, w: 44, h: 50 };
function drawBook() {
  const { bx, b, w, h } = BOOK;
  const top = b - h;                   /* 外侧页顶 */
  const mid = b - h + 18;              /* 书脊（比外侧低） */
  pageL.setAttribute('d',
    'M' + (bx - w) + ',' + b +
    'L' + (bx - w) + ',' + top +
    'C' + (bx - w + 1) + ',' + (top - 5) + ' ' + (bx - 24) + ',' + (top + 2) + ' ' + bx + ',' + mid +
    'L' + bx + ',' + b + 'Z');
  pageR.setAttribute('d',
    'M' + (bx + w) + ',' + b +
    'L' + (bx + w) + ',' + top +
    'C' + (bx + w - 1) + ',' + (top - 5) + ' ' + (bx + 24) + ',' + (top + 2) + ' ' + bx + ',' + mid +
    'L' + bx + ',' + b + 'Z');
  /* 中缝：从书脊落到底边，与两页内缘重合，不会加粗 */
  spineEl.setAttribute('d', 'M' + bx + ',' + (mid + 2) + 'L' + bx + ',' + (b - 1));
}

/* 蓝钩爪：环心 (cx,cy)、半径 R，开口朝左把球扣住，手臂一直伸到画外 */
function drawClaw(cx, cy, R) {
  const a = 104 * Math.PI / 180;
  const sx = fx1(cx + Math.cos(a) * R), sy = fx1(cy + Math.sin(a) * R);
  const ex = fx1(cx + Math.cos(-a) * R), ey = fx1(cy + Math.sin(-a) * R);
  /* 从右下起，绕过右侧到右上，留出朝左的开口 */
  clawHook.setAttribute('d', 'M' + sx + ',' + sy + 'A' + R + ',' + R + ' 0 1 0 ' + ex + ',' + ey);
  clawArm.setAttribute('d',
    'M' + fx1(cx + R - 1) + ',' + fx1(cy) + 'L' + fx1(cx + R + 100) + ',' + fx1(cy));
}

function resetProps() {
  pBookG.setAttribute('opacity', 0);
  pClawG.setAttribute('opacity', 0);
  pField.setAttribute('opacity', 0);
  pPuffG.setAttribute('opacity', 0);
  pFold.setAttribute('opacity', 0);
  pGhost.setAttribute('opacity', 0);
  pHole.setAttribute('opacity', 0);
}

/* 场景内 t 秒 → 道具状态。每个场景只放一件，不抢主体 */
function updateProps(i, t) {
  /* 场景自定义道具优先：在 scenes.js 里给场景对象加 props(t) 即可，母版只提供绘图原语 */
  if (SCENES[i].props) { SCENES[i].props(t); return; }
  /* 下面这套默认道具是 tract 七场专用；场数不符就直接跳过，避免错配到别的词根 */
  if (SCENES.length !== 7) return;
  if (i === 1) {                       /* attract：沿漏斗内壁向心流动的吸力线 */
    const on = seg(t, 0.24, 0.34) * (1 - seg(t, 1.98, 0.40));
    if (on > 0.02) {
      let d = '';
      for (let n = 0; n < 3; n++) {
        const u = (t * 0.60 + n / 3) % 1;
        const v = Math.min(1, u + 0.12);
        for (const side of [-1, 1]) {
          d += 'M' + fx1(187 + side * 107 * (1 - u) - side * 6.2) + ',' + fx1(150 + 98 * u - 6.8) +
               'L' + fx1(187 + side * 107 * (1 - v) - side * 6.2) + ',' + fx1(150 + 98 * v - 6.8);
        }
      }
      pField.setAttribute('d', d);
      pField.setAttribute('opacity', (0.42 * on).toFixed(3));
    }
  } else if (i === 2) {                /* distract：一本书 + 一只把球钩走的蓝爪 */
    const bIn  = eOut(seg(t, 0.30, 0.44));
    const bDim = lerp(1, 0.45, eOut(seg(t, 1.74, 0.42)));   /* 被勾走后"书被丢下" */
    pBookG.setAttribute('opacity', (bIn * bDim).toFixed(3));
    pBookG.setAttribute('transform', 'translate(0,' + (6 * (1 - bIn)).toFixed(1) + ')');

    const cOn = seg(t, 1.44, 0.06) * (1 - seg(t, OUTRO - 0.02, 0.44));
    if (cOn > 0.02) {
      /* 环心跟着球走：贴住球的右缘，环的左半边被球盖住 → 读起来是"扣住" */
      const pd = eOut(seg(t, 1.72, 0.40));
      const st = Math.sin(Math.min(1, pd * 1.25) * Math.PI);
      const bx2 = lerp(250, 296, pd), by2 = lerp(183, 206, pd);
      const rx2 = 15 * (1 + 0.20 * st);
      const hc = bx2 + rx2 + 1;
      const hcx = t < 1.72 ? lerp(412, hc, eOut(seg(t, 1.46, 0.26))) : hc;
      drawClaw(hcx, by2, 11);
      pClawG.setAttribute('opacity', cOn.toFixed(3));
    }
  } else if (i === 3) {                /* extract：球被拔出时，杯口冒出三缕气流 */
    const on = seg(t, 0.98, 0.20) * (1 - seg(t, 1.72, 0.42));
    if (on > 0.02) {
      pPuffG.setAttribute('opacity', '1');
      for (let n = 0; n < 3; n++) {
        const u = clamp01(seg(t, 0.98 + n * 0.12, 0.62));
        const px = 187 + [-20, 0, 20][n] + 3.5 * Math.sin(u * 7 + n * 2);
        const py = 248 - 100 * u;
        puffs[n].setAttribute('cx', fx1(px));
        puffs[n].setAttribute('cy', fx1(py));
        puffs[n].setAttribute('r', fx1(3.4 * (1 - 0.35 * u)));
        puffs[n].setAttribute('opacity', (on * Math.sin(Math.min(1, u * 1.05) * Math.PI) * 0.62).toFixed(3));
      }
    }
  } else if (i === 4) {                /* contract：线被两头压紧，挤出一道道褶皱 */
    const c  = eOut(seg(t, 0.98, 0.94));
    const on = seg(t, 0.98, 0.22) * (1 - seg(t, 2.06, 0.34));
    if (on > 0.02) {
      const h = lerp(12, 4.5, c);
      const dx = 66 - 42 * c;
      let d = '';
      for (const s of [-1, 0, 1]) {
        d += 'M' + fx1(187 + s * dx) + ',' + fx1(196 - h) +
             'L' + fx1(187 + s * dx) + ',' + fx1(196 + h);
      }
      pFold.setAttribute('d', d);
      pFold.setAttribute('opacity', (0.46 * on).toFixed(3));
    }
  } else if (i === 5) {                /* retract：球被抽走后，原地留一个虚线空位 */
    const on = seg(t, 1.62, 0.22) * (1 - seg(t, 2.24, 0.55));
    if (on > 0.02) {
      pGhost.setAttribute('cx', 300); pGhost.setAttribute('cy', 183);
      pGhost.setAttribute('r', 13);
      pGhost.setAttribute('opacity', (0.52 * on).toFixed(3));
    }
  } else if (i === 6) {                /* subtract：碎块飞走后，原地留下"本该有"的虚线 */
    const on = seg(t, 1.58, 0.22) * (1 - seg(t, 2.28, 0.55));
    if (on > 0.02) {
      pHole.setAttribute('cx', 238); pHole.setAttribute('cy', 205);
      pHole.setAttribute('opacity', (0.55 * on).toFixed(3));
    }
  }
}

/* ================= 粒子层 ================= */
const PART_N = 24;
const partEls = [];
(function () {
  const g = document.getElementById('fxParts');
  for (let i = 0; i < PART_N; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', 0); c.setAttribute('cy', 0); c.setAttribute('r', 0);
    c.setAttribute('fill', '#9aa0a6'); c.setAttribute('opacity', 0);
    g.appendChild(c); partEls.push(c);
  }
})();

/* list: [{x,y,r,op,fill}]，最多 24 个；传 null 全部熄灭 */
function setParts(list) {
  for (let i = 0; i < PART_N; i++) {
    const c = partEls[i], p = list && list[i];
    if (!p || p.op <= 0.01 || p.r <= 0.2) { c.setAttribute('opacity', 0); continue; }
    c.setAttribute('cx', fx1(p.x)); c.setAttribute('cy', fx1(p.y));
    c.setAttribute('r', fx1(p.r));
    c.setAttribute('fill', p.fill || '#8b9199');
    c.setAttribute('opacity', p.op.toFixed(2));
  }
}

/* ================= 具象形象层 =================
 * 球表达不了的东西（剪刀、书、墙…）由这里变成实物。
 * avatar(t) 返回 { kind:'scissors', x, y, size, rot, open, op }
 *   size 单位是「1 个身长 = 多少像素」，open 0=闭合 1=全张
 */
const gAvatar = document.getElementById('mAvatar');
const avSc = document.getElementById('avScissors');
const scA = document.getElementById('scA'), scB = document.getElementById('scB');

function drawAvatar(s) {
  if (!s || (s.op !== undefined && s.op <= 0.02)) {
    gAvatar.setAttribute('opacity', 0);
    return;
  }
  gAvatar.setAttribute('opacity', (s.op === undefined ? 1 : s.op).toFixed(2));
  if (s.kind === 'scissors') {
    avSc.setAttribute('opacity', 1);
    const a = (s.open || 0) * 24;            /* 张开角度（度） */
    const S = s.size || 120;
    avSc.setAttribute('transform',
      'translate(' + fx1(s.x) + ',' + fx1(s.y) + ') rotate(' + ((s.rot || 0)).toFixed(1) + ') scale(' + S.toFixed(1) + ')');
    scA.setAttribute('transform', 'rotate(' + (-a).toFixed(1) + ')');
    scB.setAttribute('transform', 'rotate(' + a.toFixed(1) + ')');
  }
}

/* 线的缺口：用 mask 真的挖掉一段，背景直接透出来，比盖色块干净 */
const maskCut = document.getElementById('maskCut');
let cutX = 0, cutW = 0;
function setLineCut(x, w) { cutX = x; cutW = w; }

function resetFx() {
  resetProps();
  fxRing.setAttribute('opacity', 0);
  fxRing2.setAttribute('opacity', 0);
  fxDust.setAttribute('opacity', 0);
  fxInk.setAttribute('opacity', 0);
  fxShadow.setAttribute('opacity', 0);
  fxSpeed.setAttribute('opacity', 0);
  fxTrailA.setAttribute('opacity', 0);
  fxTrailB.setAttribute('opacity', 0);
}

/* 拖尾：用「同一具身体的残影」，形状跟着本体一起变形，读起来是拖痕而不是两个孤立的椭圆 */
function updateTrail(s, t) {
  if (t < 0.16) return;
  const d0 = s.dot(t);
  if (d0.d) return;                       /* 自定义形状不画同形残影，会糊成一团 */
  const d1 = s.dot(Math.max(0.02, t - 0.035));
  const d2 = s.dot(Math.max(0.02, t - 0.070));
  const sp = Math.hypot(d0.x - d1.x, d0.y - d1.y);
  const k = clamp01((sp - 1.6) / 9);
  if (k <= 0) return;
  const gf = d0.tint ? mixColor(BLUE, ALERT, clamp01(d0.tint)) : BLUE;
  const ghost = (el, dd, sc, op) => {
    if ((dd.split || 0) > 0.02) { el.setAttribute('opacity', 0); return; }
    /* 极端形变（压成一滩）时残影会碎成怪形，直接不画 */
    const ratio = Math.max(dd.rx, dd.ry) / Math.max(0.1, Math.min(dd.rx, dd.ry));
    if (ratio > 2.0) { el.setAttribute('opacity', 0); return; }
    el.setAttribute('d', bodyD(dd.x, dd.y, dd.rx * sc, dd.ry * sc, dd.rot || 0, dd.shape || 'round'));
    el.setAttribute('fill', gf);
    el.setAttribute('opacity', op);
  };
  ghost(fxTrailA, d1, 0.94, 0.26 * k);
  ghost(fxTrailB, d2, 0.86, 0.12 * k);
}

/* ================= 渲染 ================= */
function renderAt(time) {
  const loc = localize(time);
  const i = loc.i;
  if (i !== idx) setScene(i);

  const t = toAnim(loc.tl, VO_DUR[i]);
  const s = SCENES[i];
  const prev = SCENES[(i + SCENES.length - 1) % SCENES.length];

  /* ---- 镜头：结尾自动回标准机位，跨场不跳 ---- */
  const camBack = 1 - eInOut(seg(t, OUTRO - 0.02, 0.62));
  applyCam(s.cam ? s.cam(t) : CAM0, camBack);

  /* ---- 线 ---- */
  const mp = eOut(seg(t, 0.05, 0.55));
  /* 场景末尾把形变收回，否则下一场 morph 会从"被拉过的位置"跳回静态 pts */
  const back = 1 - eInOut(seg(t, OUTRO - 0.10, 0.70));
  const dxy = s.lineDelta ? s.lineDelta(t) : [0, 0];
  const dpt = s.linePts ? s.linePts(t) : null;
  const pts = s.line.pts.map((p, k) => {
    const q = prev.line.pts[k];
    const e = dpt ? dpt[k] : dxy;
    return [lerp(q[0], p[0], mp) + e[0] * back, lerp(q[1], p[1], mp) + e[1] * back];
  });
  /* 场景可以用 linePath(t) 自己出路径 —— 剪断、分叉这类断开效果靠它 */
  if (s.linePath) {
    lineEl.setAttribute('d', s.linePath(t));
  } else {
    lineEl.setAttribute('d',
      `M${pts[0][0]},${pts[0][1]}L${pts[1][0]},${pts[1][1]}` +
      `L${pts[2][0]},${pts[2][1]}L${pts[3][0]},${pts[3][1]}`);
  }
  const baseLw = lerp(prev.line.lw, s.line.lw, mp);
  lineEl.setAttribute('stroke-width', (baseLw + (s.lineLw ? s.lineLw(t) : 0)).toFixed(2));

  /* ---- 点 ---- */
  const d = s.dot(t);
  drawBall(d);
  drawSub(s.sub ? s.sub(t) : null);

  /* ---- 特效 ---- */
  resetFx();
  if (s.fx) s.fx(t);
  updateProps(i, t);
  setParts(s.particles ? s.particles(t) : null);
  drawAvatar(s.avatar ? s.avatar(t) : null);
  if (cutW > 0.5) {
    maskCut.setAttribute('x', cutX.toFixed(1)); maskCut.setAttribute('y', 178);
    maskCut.setAttribute('width', cutW.toFixed(1)); maskCut.setAttribute('height', 36);
  } else {
    maskCut.setAttribute('width', 0);
  }
  updateTrail(s, t);

  /* ---- 文字 ---- */
  const pin  = seg(t, 0.16, 0.44, eOut);
  const pout = seg(t, OUTRO, 0.34, eIn);
  prefixEl.style.opacity = pin * (1 - pout);
  prefixEl.style.transform = `translateX(${(1 - pin) * 14 - pout * 8}px)`;

  const posIn  = seg(t, 0.16, 0.52, eOut);
  const posOut = seg(t, OUTRO, 0.38, eIn);
  const k = posIn * (1 - posOut);
  wordEl.style.transform = `translateX(${-shift * (1 - k)}px)`;

  const pz = seg(t, 1.60, 0.42, eOut);
  const oz = seg(t, OUTRO + 0.04, 0.32, eIn);
  zhEl.style.opacity = pz * (1 - oz);
  zhEl.style.transform = `translateY(${(1 - pz) * 12}px)`;

  const showGloss = s.prefix !== '';
  const pg = seg(t, 1.90, 0.42, eOut);
  const og = seg(t, OUTRO + 0.02, 0.32, eIn);
  glossEl.style.opacity = showGloss ? pg * (1 - og) : 0;
  glossEl.style.transform = `translateY(${(1 - pg) * 10}px)`;
}

/* ================= 音效 ================= */
const Sfx = (() => {
  let ctx = null, master = null, noiseBuf = null, muted = false;

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);
    const n = ctx.sampleRate * 1.2;
    noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
  }

  function noise(gain, filterType, f0, f1, t, dur) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const flt = ctx.createBiquadFilter();
    flt.type = filterType;
    flt.frequency.setValueAtTime(f0, t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    flt.Q.value = 1.1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt).connect(g).connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  }

  function tone(type, gain, f0, f1, t, dur) {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }

  return {
    init,
    get ready() { return !!ctx; },
    play(kind, arg) {
      if (!ctx || muted) return;
      const t = ctx.currentTime + 0.005;
      switch (kind) {
        case 'thud':
          tone('sine', 0.34, 150, 48, t, 0.20);
          noise(0.06, 'lowpass', 900, 300, t, 0.11); break;
        case 'tick':
          noise(0.22, 'highpass', 2400, 3200, t, 0.07);
          tone('triangle', 0.10, 1600, 900, t, 0.06); break;
        case 'whoosh':
          noise(arg || 0.16, 'bandpass', 420, 2600, t, 0.46); break;
        case 'riser':
          noise(0.13, 'bandpass', 300, 2200, t, 0.75);
          tone('sine', 0.10, 90, 200, t, 0.75); break;
        case 'thoom':
          tone('sine', 0.30, 96, 42, t, 0.42);
          noise(0.08, 'lowpass', 500, 140, t, 0.35); break;
        case 'charge': {
          /* arg = 蓄力时长，回缩/压杯是短促 0.22~0.30，横线下压是绵长 0.58 */
          const d = arg || 0.32;
          noise(0.11, 'bandpass', 320, 1500, t, d);
          tone('sine', 0.055, 70, 152, t, d); break;
        }
        case 'pop':
          tone('sine', 0.17, 640, 1180, t, 0.11); break;
        case 'swish':
          noise(0.055, 'lowpass', 1100, 260, t, 0.55); break;
      }
    }
  };
})();

/* 音效时间表：与 _tool/make-audio.js 的 CUES 完全一致（场景内相对秒数）
   每个时刻都取自该场景 dot()/fx() 的关键分支点，两条轨道同刻起跑 */
const CUES_BY_SCENE = [
  /* 0 tract     飞入 0.05 → 蓄力 0.62 → 拽 0.90 → 回弹 1.70 */
  [[0.05, 'swish'], [0.62, 'charge', 0.28], [0.90, 'whoosh'], [1.70, 'thud'], [1.60, 'pop'], [2.20, 'tick']],
  /* 1 attract   飞入 → 悬停 → 吸入 0.92 → 砸在漏斗尖 1.52 */
  [[0.05, 'swish'], [0.92, 'whoosh'], [1.52, 'thud'], [1.72, 'pop']],
  /* 2 distract  飞入 → 被左右拉扯（三声轻响）→ 被拽走 2.10 */
  [[0.05, 'swish'], [1.00, 'tick'], [1.24, 'tick'], [1.46, 'tick'], [1.72, 'tick'], [2.12, 'thud'], [1.60, 'pop']],
  /* 3 extract   飞入 → 杯底蓄力 0.80 → 抽出 1.00 */
  [[0.05, 'swish'], [0.80, 'charge', 0.22], [1.00, 'whoosh', 0.58], [1.00, 'tick'], [1.60, 'pop']],
  /* 4 contract  飞入 → 落线 → 两端收拢 0.95 → 收到底 1.86 */
  [[0.05, 'swish'], [0.90, 'charge', 0.90], [1.86, 'thoom'], [1.60, 'pop']],
  /* 5 retract   飞入 → 拉出 0.95 → 猛缩回 1.60 → 撞左端 2.06 */
  [[0.05, 'swish'], [0.95, 'whoosh'], [1.60, 'whoosh'], [2.06, 'thud'], [1.60, 'pop']],
  /* 6 subtract  飞入 → 抓右端 → 下拽 0.95 → 绷断 1.55 */
  [[0.05, 'swish'], [0.95, 'thud'], [1.28, 'whoosh'], [1.55, 'thud'], [1.80, 'pop']],
];

/* 音效绝对时刻表：场景起点 + 场景内秒数 */
const CUE_ABS = [];
SCENES.forEach(function (s, i) {
  CUES_BY_SCENE[i].forEach(function (c) { CUE_ABS.push({ at: STARTS[i] + c[0], kind: c[1], arg: c[2] }); });
});
CUE_ABS.sort(function (a, b) { return a.at - b.at; });

function fireCues(fromT, toT) {
  if (!Sfx.ready) return;
  for (let k = 0; k < CUE_ABS.length; k++) {
    const c = CUE_ABS[k];
    if (c.at > fromT && c.at <= toT) Sfx.play(c.kind, c.arg);
  }
}

/* ================= 主循环 ================= */
const totalDur = TOTAL;

function loop(now) {
  const dt = now - last;
  last = now;
  if (!paused) {
    const nt = T + dt / 1000;
    if (nt >= totalDur) {
      fireCues(T, totalDur);
      fireCues(0, nt - totalDur);
      T = nt % totalDur;
    } else {
      fireCues(T, nt);
      T = nt;
    }
  }
  renderAt(T);
  requestAnimationFrame(loop);
}

function fit() {
  const s = Math.min(window.innerWidth / 375, window.innerHeight / 667);
  stage.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit);
fit();

stage.addEventListener('click', () => {
  if (!Sfx.ready) Sfx.init();
  const cur = localize(T);
  T = STARTS[(cur.i + 1) % SCENES.length];
});
window.addEventListener('keydown', ev => {
  if (ev.code === 'Space') { ev.preventDefault(); paused = !paused; }
  if (ev.code === 'ArrowRight') T = (Math.floor(T / DUR) + 1) * DUR;
  if (ev.code === 'ArrowLeft')  T = (Math.floor(T / DUR) - 1 + SCENES.length) * DUR;
});

setScene(0);
drawBook();
renderAt(0);
requestAnimationFrame(loop);
</script>
</body>
